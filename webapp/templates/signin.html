{% extends "base.html" %}

{% block title %}Sign In — DigiBook{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="card auth-card">
        <div class="card-header">
            <h2>Student Sign In</h2>
            <p>Access your saved whiteboards remotely.</p>
        </div>

        <form method="POST" action="{{ url_for('views.signin') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com" class="form-control">
            </div>

            <div class="form-group">
                <label for="pin">4-Digit PIN</label>
                <input type="password" id="pin" name="pin" required maxlength="4" pattern="\d{4}" placeholder="••••" class="form-control text-center pin-input">
                <small class="form-help">Enter the same 4-digit PIN used for your physical RFID whiteboard login.</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>

            <div class="auth-footer-link">
                <span>New student?</span>
                <a href="{{ url_for('views.signup') }}">Register here</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
